

<ion-content class="ion-padding" color="light">
  <div class="login-container" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%;">
    
    <!-- Logo / Encabezado -->
    <div style="text-align: center; margin-bottom: 30px;">
      <div style="background-color: var(--ion-color-primary); width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px auto;">
        <ion-icon name="school-outline" style="font-size: 40px; color: white;"></ion-icon>
      </div>
      <h1 style="font-weight: bold; color: #333;">MdE</h1>
      <p style="color: #666; font-size: 14px;">Mesas de Examen</p>
    </div>

    <!-- Formulario de Ingreso -->
    <ion-card style="width: 100%; max-width: 400px; padding: 20px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.08);">
      <h3 style="margin-bottom: 20px; font-weight: 600; color: #333;">Iniciar Sesión</h3>

      <ion-item fill="outline" style="margin-bottom: 15px;">
        <ion-input label="DNI" labelPlacement="stacked" placeholder="Ingrese su DNI"></ion-input>
      </ion-item>

      <ion-item fill="outline" style="margin-bottom: 20px;">
        <ion-input label="Contraseña" labelPlacement="stacked" type="password" placeholder="Ingrese su contraseña"></ion-input>
      </ion-item>

      <ion-button expand="block" routerLink="/tabs/inicio" color="primary" style="height: 48px; font-weight: bold;">
        Ingresar
      </ion-button>
    </ion-card>

  </div>
</ion-content>
